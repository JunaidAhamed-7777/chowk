name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      browser_matrix:
        description: Verify Chromium, Firefox and WebKit
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run bench:smoke
      - run: npm run assets:check
      - run: npm run build
      - run: npm exec -- playwright install --with-deps chromium
      - if: ${{ inputs.browser_matrix }}
        run: npm exec -- playwright install --with-deps firefox webkit
      - run: npm exec -- playwright test
        env:
          CHOWK_BROWSER_MATRIX: ${{ inputs.browser_matrix && '1' || '0' }}
          CHOWK_VERIFY_REPRO: ${{ inputs.browser_matrix && '1' || '0' }}
