<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 265" role="img" aria-labelledby="title description">
<title id="title">Lane-free traffic comparison</title><desc id="description">Paired relative differences in simulated delay per person, with 95% bootstrap confidence intervals. Lower delay is better.</desc>
<rect width="760" height="265" rx="12" fill="#0a0f1a"/>
<g font-family="system-ui, sans-serif" font-size="14">
<text x="25" y="32" fill="#e8edf5" font-weight="650">Relative difference in delay per person</text>
<text x="330" y="58" fill="#3df2b4">Mixed traffic</text><text x="450" y="58" fill="#ffc27a">Cars only</text><text x="550" y="58" fill="#aab5c7">95% paired intervals</text>
<line x1="510" x2="510" y1="69" y2="229" stroke="#697688" stroke-dasharray="3 4"/><text x="25" y="95" fill="#e8edf5">CHOWK vs area max-pressure</text><line x1="501.71751900756936" x2="520.3792467541249" y1="83" y2="83" stroke="#3df2b4" stroke-width="2"/><circle cx="511.32171921630936" cy="83" r="4" fill="#3df2b4"><title>+0.1%</title></circle><line x1="505.7456112134734" x2="512.445391743296" y1="100" y2="100" stroke="#ffc27a" stroke-width="2"/><circle cx="508.81696323448864" cy="100" r="4" fill="#ffc27a"><title>−0.1%</title></circle><text x="25" y="154" fill="#e8edf5">CHOWK vs Webster fixed-time</text><line x1="441.040454974746" x2="460.37072575438646" y1="142" y2="142" stroke="#3df2b4" stroke-width="2"/><circle cx="450.54658865243846" cy="142" r="4" fill="#3df2b4"><title>−2.8%</title></circle><line x1="399.3278213612126" x2="420.0168664609974" y1="159" y2="159" stroke="#ffc27a" stroke-width="2"/><circle cx="409.9440620971592" cy="159" r="4" fill="#ffc27a"><title>−4.7%</title></circle><text x="25" y="213" fill="#e8edf5">Area vs count max-pressure</text><line x1="488.895032946054" x2="508.49742681083166" y1="201" y2="201" stroke="#3df2b4" stroke-width="2"/><circle cx="498.8398368490927" cy="201" r="4" fill="#3df2b4"><title>−0.5%</title></circle><line x1="501.7878728040996" x2="512.8289255795858" y1="218" y2="218" stroke="#ffc27a" stroke-width="2"/><circle cx="507.35359816234643" cy="218" r="4" fill="#ffc27a"><title>−0.1%</title></circle>
<g fill="#aab5c7" text-anchor="middle"><text x="295" y="246">−10.0%</text><text x="510" y="246">0%</text><text x="725" y="246">+10.0%</text></g>
</g></svg>
