<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 265" role="img" aria-labelledby="title description">
<title id="title">Lane-free traffic comparison</title><desc id="description">Paired relative differences in simulated delay per person, with 95% bootstrap confidence intervals. Lower delay is better.</desc>
<rect width="760" height="265" rx="12" fill="#0a0f1a"/>
<g font-family="system-ui, sans-serif" font-size="14">
<text x="25" y="32" fill="#e8edf5" font-weight="650">Relative difference in delay per person</text>
<text x="330" y="58" fill="#3df2b4">Mixed traffic</text><text x="450" y="58" fill="#ffc27a">Cars only</text><text x="550" y="58" fill="#aab5c7">95% paired intervals</text>
<line x1="510" x2="510" y1="69" y2="229" stroke="#697688" stroke-dasharray="3 4"/><text x="25" y="95" fill="#e8edf5">CHOWK vs area max-pressure</text><line x1="478.5301836938417" x2="510.8725338697175" y1="83" y2="83" stroke="#3df2b4" stroke-width="2"/><circle cx="496.0703743835377" cy="83" r="4" fill="#3df2b4"><title>−0.6%</title></circle><line x1="481.91134372534947" x2="511.9238500938161" y1="100" y2="100" stroke="#ffc27a" stroke-width="2"/><circle cx="496.2691054586304" cy="100" r="4" fill="#ffc27a"><title>−0.6%</title></circle><text x="25" y="154" fill="#e8edf5">CHOWK vs Webster fixed-time</text><line x1="398.9032908836082" x2="428.5792135408431" y1="142" y2="142" stroke="#3df2b4" stroke-width="2"/><circle cx="413.26315413086513" cy="142" r="4" fill="#3df2b4"><title>−4.5%</title></circle><line x1="340.5512834219963" x2="376.05121605656575" y1="159" y2="159" stroke="#ffc27a" stroke-width="2"/><circle cx="358.03743031806016" cy="159" r="4" fill="#ffc27a"><title>−7.1%</title></circle><text x="25" y="213" fill="#e8edf5">Area vs count max-pressure</text><line x1="468.03054316895566" x2="495.6320454694923" y1="201" y2="201" stroke="#3df2b4" stroke-width="2"/><circle cx="481.6281122106797" cy="201" r="4" fill="#3df2b4"><title>−1.3%</title></circle><line x1="505.46293235459376" x2="532.0992096158943" y1="218" y2="218" stroke="#ffc27a" stroke-width="2"/><circle cx="519.1788474932891" cy="218" r="4" fill="#ffc27a"><title>+0.4%</title></circle>
