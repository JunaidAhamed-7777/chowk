<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 265" role="img" aria-labelledby="title description">
<title id="title">Lane-free traffic comparison</title><desc id="description">Paired relative differences in simulated delay per person, with 95% bootstrap confidence intervals. Lower delay is better.</desc>
<rect width="760" height="265" rx="12" fill="#0a0f1a"/>
<g font-family="system-ui, sans-serif" font-size="14">
<text x="25" y="32" fill="#e8edf5" font-weight="650">Relative difference in delay per person</text>
<text x="330" y="58" fill="#3df2b4">Mixed traffic</text><text x="450" y="58" fill="#ffc27a">Cars only</text><text x="550" y="58" fill="#aab5c7">95% paired intervals</text>
<line x1="510" x2="510" y1="69" y2="229" stroke="#697688" stroke-dasharray="3 4"/><text x="25" y="95" fill="#e8edf5">CHOWK vs area max-pressure</text><line x1="485.8810105484307" x2="504.48522949567473" y1="83" y2="83" stroke="#3df2b4" stroke-width="2"/><circle cx="495.3642632848644" cy="83" r="4" fill="#3df2b4"><title>−4.6%</title></circle><line x1="495.94689514003727" x2="511.6936419637196" y1="100" y2="100" stroke="#ffc27a" stroke-width="2"/><circle cx="503.52647643208144" cy="100" r="4" fill="#ffc27a"><title>−2.0%</title></circle><text x="25" y="154" fill="#e8edf5">CHOWK vs Webster fixed-time</text><line x1="309.0756556068917" x2="326.5473828618216" y1="142" y2="142" stroke="#3df2b4" stroke-width="2"/><circle cx="317.7140910679326" cy="142" r="4" fill="#3df2b4"><title>−60.0%</title></circle><line x1="295" x2="305.43503958772044" y1="159" y2="159" stroke="#ffc27a" stroke-width="2"/><circle cx="299.99369606350353" cy="159" r="4" fill="#ffc27a"><title>−65.5%</title></circle><text x="25" y="213" fill="#e8edf5">Area vs count max-pressure</text><line x1="458.02592871872105" x2="486.2640865274144" y1="201" y2="201" stroke="#3df2b4" stroke-width="2"/><circle cx="472.182701861935" cy="201" r="4" fill="#3df2b4"><title>−11.8%</title></circle><line x1="500.7791275680563" x2="522.560849540536" y1="218" y2="218" stroke="#ffc27a" stroke-width="2"/><circle cx="511.0629226685429" cy="218" r="4" fill="#ffc27a"><title>+0.3%</title></circle>
<g fill="#aab5c7" text-anchor="middle"><text x="295" y="246">−67.0%</text><text x="510" y="246">0%</text><text x="725" y="246">+67.0%</text></g>
</g></svg>
